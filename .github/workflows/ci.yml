# Runs the check suite on every pull request and on pushes to main.
#
# Until this existed the only workflow here was main.yml ("Update POTs"), which
# fires on a schedule — so nothing verified a change before it reached main.
# phpcs, PHPStan and PHPUnit had never run in CI at all.
name: CI

# A new push to the same pull request makes the in-flight run obsolete, so
# cancel it rather than paying for a result nobody will read. The event is
# encoded in the group key rather than in cancel-in-progress: that expression
# yields the *string* "false" on a push, and a non-empty string is truthy, so
# pushes to main would cancel one another. Keying pushes by SHA gives every
# commit on main its own group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to a commit SHA rather than a moving tag. A tag can be
# repointed at new code by whoever controls the upstream repository, so the pin
# is what makes a compromised action show up as a reviewable diff rather than
# arriving silently. The trailing comment carries the human-readable version;
# Dependabot rewrites the SHA and the comment together.

jobs:
  # Static analysis and code style. No network, no API, so this is the job that
  # should stay green regardless of what any external service is doing.
  quality:
    name: Quality (phpcs · phpstan · parallel-lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: intl, json, gettext
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax check
        run: composer parallel-lint

      - name: Code style
        run: composer lint

      - name: Static analysis
        run: composer analyse

  # A syntax check on every version the library can actually run on, so
  # newer-only syntax cannot slip in unnoticed. It proves parsing, not runtime
  # behaviour.
  #
  # 8.1 is deliberately absent, and composer.json's `"php": ">=8.1"` is wrong:
  # src/WebCalendar/Column.php builds `case ALL` from other cases' ->value, and
  # 8.1 rejects that with "Enum case value must be compile-time evaluatable".
  # The floor is really 8.2. That constraint predates this branch, so it is
  # flagged rather than changed here — bumping it is a packaging decision.
  compat:
    name: Syntax on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, json, gettext
          coverage: none
          tools: composer:v2

      # No `composer install` here, deliberately. The committed lock pins dev
      # dependencies that themselves require php >=8.4 (symfony/var-exporter via
      # symfony/cache), so installing on 8.1-8.3 fails before any check runs —
      # the dev toolchain is 8.4-only even though the library is not. `php -l`
      # needs nothing installed and is exactly the question this job asks.
      - name: Syntax check
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "All source files parse on PHP ${{ matrix.php }}"


  markdown:
    name: Markdown (markdownlint · prettier)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install markdown tooling
        run: npm install --no-audit --no-fund

      # Two complementary tools: markdownlint owns the .markdownlint.yml rules,
      # prettier owns formatting. markdownlint --fix cannot repair what prettier
      # does, so neither substitutes for the other.
      - name: Lint markdown
        run: composer lint:md

      - name: Check markdown formatting
        run: composer format:md

  # This suite has no fixtures: every CalendarSelect constructed in a test
  # fetches /calendars over HTTP, and CalendarSelectTest resets the metadata
  # singleton before each test, so a run issues dozens of requests in seconds.
  # Pointed at the public API that gets rate-limited, and the whole suite then
  # fails with connection timeouts that read exactly like a code regression.
  #
  # So CI boots its own API and points the library at it through
  # LITCAL_API_URL, which is the same hook tests/bootstrap.php uses to prefer a
  # local API during development.
  tests:
    name: Tests (PHPUnit against a local API)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `development` deliberately, not a pinned SHA — the opposite of the policy
      # for actions above, and for the opposite reason. An action is third-party
      # code we execute, so it is pinned to stop it changing under us. The API is
      # the contract this library is written against, so tracking its head is the
      # point: when the API changes shape, these tests should break here rather
      # than in a consumer's application. A pin would convert that signal into
      # silence until someone remembered to bump it.
      - name: Check out the API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Liturgical-Calendar/LiturgicalCalendarAPI
          ref: development
          path: .litcal-api
          persist-credentials: false

      # The API requires php >=8.4, which is why the tests run on 8.4 rather
      # than across the library's whole supported range; `compat` above covers
      # the older versions as far as syntax.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: intl, json, gettext, calendar, ctype, curl, dom, libxml, mbstring, simplexml, xml, zip
          coverage: none
          tools: composer:v2

      # The Italian assertions in RiteSelectTest and CalendarSelectRiteTest skip
      # themselves when no Italian locale is installed, and an ubuntu runner
      # carries almost none — without this the localization would silently go
      # unverified in CI, which is the one place it matters most.
      # gettext brings msgfmt and friends; the runtime lookup is glibc's, and the
      # PHP extension is installed by setup-php above. Included because a runner
      # without the package is one plausible reason the catalog assertions skip
      # here while passing locally — the tests report which case they hit, so if
      # this changes nothing the skip message will still say so.
      - name: Install gettext and the Italian locale
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext locales
          sudo locale-gen it_IT.UTF-8
          sudo update-locale
          locale -a | grep -i '^it_IT' || ( echo 'it_IT locale missing' && exit 1 )
          msgfmt --version | head -1

      - name: Install library dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install API dependencies
        working-directory: .litcal-api
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      # Without a .env the API emits `Warning: Undefined array key
      # "API_BASE_PATH"` before its response, and laminas then refuses to emit
      # one at all: `Output has been emitted previously`. The example file is
      # already configured for local development, where API_BASE_PATH is empty
      # because the API runs at the root.
      #
      # UNAUTHENTICATED_RATE_LIMIT is raised because the API rate-limits by IP
      # and this suite issues dozens of requests in seconds — the same limit
      # that makes the public instance unusable from a test run. The .env.example
      # comment recommends exactly this for test suites.
      - name: Configure the API
        working-directory: .litcal-api
        run: |
          cp .env.example .env
          sed -i 's/^UNAUTHENTICATED_RATE_LIMIT=.*/UNAUTHENTICATED_RATE_LIMIT=100000/' .env
          grep '^UNAUTHENTICATED_RATE_LIMIT' .env

      # PHP_CLI_SERVER_WORKERS is not optional: the router refuses to build its
      # path table on a single-worker built-in server and throws
      # ServiceUnavailableException. That surfaces as HTTP 200 carrying a PHP
      # fatal, which is why readiness below inspects the body rather than the
      # status — a status check alone passes on the broken case.
      - name: Start the API
        working-directory: .litcal-api
        env:
          PHP_CLI_SERVER_WORKERS: 6
        run: |
          nohup php -S 127.0.0.1:8000 -t public > "${RUNNER_TEMP}/litcal-api.log" 2>&1 &
          echo "Waiting for the API to serve a calendar index..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/calendars 2>/dev/null \
                 | python3 -c 'import json,sys; d=json.load(sys.stdin); i=d.get("litcal_metadata",d); sys.exit(0 if i.get("national_calendars") else 1)' 2>/dev/null; then
              echo "API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "The API did not come up. Response was:"
          curl -sS http://127.0.0.1:8000/calendars | head -c 800 || true
          echo
          echo "Server log:"
          cat "${RUNNER_TEMP}/litcal-api.log"
          exit 1

      - name: Run the tests
        env:
          LITCAL_API_URL: http://127.0.0.1:8000
        run: composer test

      - name: Show the API log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/litcal-api.log" || true
